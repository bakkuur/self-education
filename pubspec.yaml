name: smart
description: A new Flutter project for smart school application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Localization
  google_fonts: ^6.1.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0          # <-- تم التعديل هنا

  # Storage & State Management
  shared_preferences: ^2.2.2
  provider: ^6.1.1

  # Image & Media
  image_picker: ^1.0.5

  # Utils
  equatable: ^2.0.5
  cupertino_icons: ^1.0.6
  cloud_firestore: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true